<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Saloony - Add New Salon</title>
    <link rel="icon" type="image/png" href="/images/Saloony-app_icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/admin_saloony/assets/admin-style.css">
    <script defer src="/admin_saloony/assets/admin-core.js"></script>
</head>
<body class="page-transition page-fade-in">
    <!-- Security Check -->
    <script>
        (function() {
            const token = localStorage.getItem('adminToken');
            if (!token) window.location.replace('/auth.html');
        })();
    </script>

    <!-- Main Content -->
    <div id="admin-layout-wrapper">
        <div class="page-container">
            <div id="message-box" class="hidden p-4 mb-6 text-center rounded-xl font-bold shadow-sm transition-all duration-300 max-w-3xl mx-auto" role="alert"></div>

            <div class="max-w-4xl mx-auto">
                <div class="card p-8">
                    <div class="card-header border-b-0 pb-0 mb-6">
                        <h2 class="card-title text-2xl">New Salon Details</h2>
                        <p class="text-muted mt-1">Enter owner information and salon details to create a new account</p>
                    </div>
                    
                    <form id="create-salon-form" class="space-y-8">
                        <input type="hidden" name="user_type" value="salon">

                        <!-- Owner Details Section -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-bold text-slate-700 flex items-center gap-2 pb-2 border-b border-slate-100">
                                <i class="fas fa-user-tie text-emerald-500"></i> Owner Information
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Owner Name</label>
                                    <input type="text" name="owner_name" required class="w-full">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Owner Phone (Login)</label>
                                    <input type="tel" name="owner_phone" placeholder="05xxxxxxxx" required pattern="0[0-9]{9}" class="w-full font-mono" dir="ltr">
                                    <p class="text-xs text-muted mt-1 text-right">This number is used for login</p>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
                                    <input type="email" name="email" required class="w-full font-mono" dir="ltr">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                                    <input type="text" value="Auto-generated upon creation" disabled class="w-full bg-slate-100 text-slate-500 italic">
                                </div>
                            </div>
                        </div>

                        <!-- Salon Details Section -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-bold text-slate-700 flex items-center gap-2 pb-2 border-b border-slate-100">
                                <i class="fas fa-store text-emerald-500"></i> Salon Information
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Salon Name</label>
                                    <input type="text" name="name" required class="w-full">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Salon Phone (Bookings)</label>
                                    <input type="tel" name="phone" placeholder="05xxxxxxxx" required pattern="0[0-9]{9}" class="w-full font-mono" dir="ltr">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">City</label>
                                    <select name="city" id="city-select" required class="w-full">
                                        <option value="" disabled selected>Select City</option>
                                        <!-- Populated by JS -->
                                    </select>
                                </div>
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Detailed Address</label>
                                    <input type="text" name="address" required class="w-full">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Salon Category</label>
                                    <select name="gender_focus" required class="w-full">
                                        <option value="women">Women</option>
                                        <option value="men">Men</option>
                                        <option value="mixed">Mixed</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="pt-6 flex gap-4 border-t border-slate-100">
                            <button type="submit" id="submit-btn" class="btn btn-primary flex-1 py-3 text-base">
                                <i class="fas fa-plus-circle"></i> Create Salon Account
                            </button>
                            <button type="button" onclick="window.location.href='/admin_saloony/dashboard/index.html'" class="btn btn-secondary px-6">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Populate Cities from API
        const citySelect = document.getElementById('city-select');
        fetch('/api/cities')
            .then(res => res.json())
            .then(data => {
                const cities = Array.isArray(data) ? data : (data.cities || []);
                cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
            })
            .catch(err => {
                console.error('Error fetching cities:', err);
                // Fallback cities
                ['Riyadh', 'Jeddah', 'Dammam', 'Makkah', 'Medina'].forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
            });

        // Toast Helper
        function showToast(message, type = 'success') {
            const box = document.getElementById('message-box');
            box.textContent = message;
            box.className = 'p-4 mb-6 text-center rounded-xl font-bold shadow-sm transition-all duration-300 max-w-3xl mx-auto';
            if (type === 'success') box.classList.add('bg-emerald-100','text-emerald-800', 'border', 'border-emerald-200');
            else if (type === 'error') box.classList.add('bg-red-100','text-red-800', 'border', 'border-red-200');
            else box.classList.add('bg-blue-100','text-blue-800', 'border', 'border-blue-200');
            box.classList.remove('hidden');
            box.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (type === 'success') {
                setTimeout(() => box.classList.add('hidden'), 5000);
            }
        }

        // Handle Form Submit
        document.getElementById('create-salon-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('submit-btn');
            const originalBtnHTML = btn.innerHTML;
            
            // Basic Validation
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            // Validate phones
            const phonePattern = /^0[0-9]{9}$/;
            if (!phonePattern.test(data.owner_phone)) {
                showToast('Invalid Owner Phone (must start with 0 and be 10 digits)', 'error');
                return;
            }
            if (!phonePattern.test(data.phone)) {
                showToast('Invalid Salon Phone (must start with 0 and be 10 digits)', 'error');
                return;
            }

            // Disable button
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

            const adminToken = localStorage.getItem('adminToken');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminToken}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    if (result.generated_password) {
                        // Use prompt to allow easy copying of the password
                        window.prompt("Salon created successfully! Please copy the generated password:", result.generated_password);
                        showToast('Salon account created successfully!', 'success');
                    } else {
                        showToast('Salon account created successfully!', 'success');
                    }
                    
                    form.reset();
                    setTimeout(() => {
                        window.location.href = '/admin_saloony/dashboard/index.html';
                    }, 1000);
                } else {
                    showToast(result.message || 'حدث خطأ أثناء إنشاء الحساب', 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalBtnHTML;
                }
            } catch (error) {
                console.error(error);
                showToast('خطأ في الاتصال بالخادم', 'error');
                btn.disabled = false;
                btn.innerHTML = originalBtnHTML;
            }
        });
    </script>
</body>
</html>
