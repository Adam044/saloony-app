<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Salons Management - Saloony Admin</title>
    <link rel="icon" type="image/png" href="/images/Saloony-app_icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/admin_saloony/assets/admin-style.css">
    <script defer src="/admin_saloony/assets/admin-core.js"></script>
    <style>
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .badge { padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:6px; }
        .badge-active { background:#D1FAE5; color:#065F46; border:1px solid #A7F3D0; }
        .badge-inactive { background:#FEE2E2; color:#991B1B; border:1px solid #FECACA; }
        .sub-badge { background:#DBEAFE; color:#1E40AF; border:1px solid #BFDBFE; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700; }
    </style>
</head>
<body class="page-transition page-fade-in">
    <!-- Admin Header/Layout injected by admin-header.js -->
    
    <div id="admin-layout-wrapper">
        <div class="page-container">
            <section class="card mb-6 flex items-center justify-between">
                <div>
                    <h2 class="card-title">Salons Management</h2>
                    <p class="text-muted text-sm mt-1">Manage registered salons and their statuses</p>
                </div>
                <a href="create_salon.html" class="btn btn-primary text-sm gap-2">
                    <i class="fas fa-plus"></i> Add Salon
                </a>
            </section>

            <section class="card mb-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" placeholder="Search by salon name..." class="input pl-10 w-full">
                    </div>
                    <div>
                        <select id="filter-status" class="input w-full">
                            <option value="">All Statuses</option>
                            <option value="accepted">Active</option>
                            <option value="pending">Pending</option>
                            <option value="rejected">Inactive</option>
                        </select>
                    </div>
                    <div>
                        <select id="filter-category" class="input w-full">
                            <option value="">All Categories</option>
                            <option value="men">Men</option>
                            <option value="women">Women</option>
                            <option value="mixed">Mixed</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="card">
                <div id="salons-container" class="table-wrapper">
                    <p class="text-center text-muted p-8">Loading salons...</p>
                </div>
            </section>
        </div>
    </div>

    <script>
        const adminToken = localStorage.getItem('adminToken');
        if (!adminToken) window.location.replace('/auth.html');

        let allSalons = [];

        async function loadSalons() {
            const container = document.getElementById('salons-container');
            container.innerHTML = '<p class="text-center text-muted p-8">Loading salons...</p>';
            try {
                const res = await fetch('/api/admin/salons', { headers: { 'Authorization': `Bearer ${adminToken}` } });
                if (!res.ok) throw new Error('Failed to fetch');
                const data = await res.json();
                allSalons = Array.isArray(data) ? data : (Array.isArray(data.salons) ? data.salons : []);

                if (!Array.isArray(allSalons) || allSalons.length === 0) {
                    container.innerHTML = '<p class="text-center text-muted p-8">No salons found.</p>';
                    return;
                }

                renderSalons(allSalons);
            } catch (e) {
                console.error('Failed to load salons:', e);
                container.innerHTML = '<p class="text-center text-red-500 p-8 font-bold">Failed to load salon data</p>';
            }
        }

        function renderSalons(salons) {
            const container = document.getElementById('salons-container');
            if (salons.length === 0) {
                container.innerHTML = '<p class="text-center text-muted p-8">No matching records found.</p>';
                return;
            }

            container.innerHTML = `
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Salon Name</th>
                            <th>Category</th>
                            <th>City</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${salons.map((s, i) => {
                            let statusBadge = '';
                            if (s.status === 'accepted') statusBadge = '<span class="badge badge-success">Active</span>';
                            else if (s.status === 'pending') statusBadge = '<span class="badge badge-warning">Pending</span>';
                            else statusBadge = '<span class="badge badge-error">Inactive</span>';

                            let categoryLabel = s.gender_focus ? (s.gender_focus.charAt(0).toUpperCase() + s.gender_focus.slice(1)) : '<span class="text-muted">-</span>';
                            
                            return `
                                <tr class="hover:bg-slate-50 transition-colors">
                                    <td>${i + 1}</td>
                                    <td class="font-bold text-slate-700">${s.salon_name}</td>
                                    <td>${categoryLabel}</td>
                                    <td>${s.city || '<span class="text-muted">-</span>'}</td>
                                    <td>${statusBadge}</td>
                                    <td>
                                        <a href="/admin/manage_salon?id=${s.id}" class="btn btn-primary text-xs py-1 px-2">
                                            <i class="fas fa-external-link-alt"></i> Open
                                        </a>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function filterSalons() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;
            const categoryFilter = document.getElementById('filter-category').value;

            const filtered = allSalons.filter(s => {
                const matchesSearch = (s.salon_name || '').toLowerCase().includes(searchTerm);
                const matchesStatus = !statusFilter || s.status === statusFilter;
                const matchesCategory = !categoryFilter || s.gender_focus === categoryFilter;
                
                return matchesSearch && matchesStatus && matchesCategory;
            });

            renderSalons(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSalons();
            
            // Attach event listeners
            document.getElementById('search-input').addEventListener('input', filterSalons);
            document.getElementById('filter-status').addEventListener('change', filterSalons);
            document.getElementById('filter-category').addEventListener('change', filterSalons);
        });
    </script>
</body>
</html>
