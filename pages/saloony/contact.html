<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تواصل معنا - صالوني</title>
<link rel="icon" href="../../assets/images/Saloony-app_icon.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../assets/css/theme.css">
<script src="../../assets/js/components.js"></script>
<style>
  /* Override or specific styles if needed */
</style>
</head>
<body class="flex flex-col min-h-screen selection:bg-[#06C167] selection:text-white overflow-x-hidden">

<div id="global-header"></div>

<main class="flex-1 pt-28 px-4 md:px-6 pb-12">
  <section class="max-w-3xl mx-auto">
    <div class="glass-card p-5 md:p-8 rounded-3xl border border-slate-200">
      <h1 class="text-3xl font-extrabold mb-4 text-slate-900">تواصل معنا</h1>
      <p class="text-slate-600 mb-8">أرسل لنا استفسارك أو ملاحظاتك وسنتواصل معك قريبًا.</p>

      <form id="contactForm" class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-bold text-slate-700 mb-2">الاسم</label>
          <input id="name" name="name" type="text" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#06C167] focus:border-transparent transition" placeholder="اسمك الكريم">
        </div>
        <div>
          <label for="email" class="block text-sm font-bold text-slate-700 mb-2">البريد الإلكتروني</label>
          <input id="email" name="email" type="email" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#06C167] focus:border-transparent transition" placeholder="example@email.com">
        </div>
        <div>
          <label for="phone" class="block text-sm font-bold text-slate-700 mb-2">رقم الهاتف</label>
          <input id="phone" name="phone" type="tel" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#06C167] focus:border-transparent transition" placeholder="05xxxxxxxx">
        </div>
        <div>
          <label for="subject" class="block text-sm font-bold text-slate-700 mb-2">الموضوع</label>
          <input id="subject" name="subject" type="text" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#06C167] focus:border-transparent transition" placeholder="عنوان موجز">
        </div>
        <div>
          <label for="message" class="block text-sm font-bold text-slate-700 mb-2">الرسالة</label>
          <textarea id="message" name="message" rows="5" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#06C167] focus:border-transparent transition" placeholder="اكتب رسالتك هنا..."></textarea>
        </div>

        <button type="submit" class="w-full btn-primary text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all">
          إرسال الرسالة
        </button>
      </form>

      <div id="statusBox" class="mt-6 hidden p-4 rounded-xl border border-slate-200"></div>
    </div>
  </section>
</main>

<div id="global-footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<script>
  // Initialize Global Components
  document.addEventListener('DOMContentLoaded', () => {
      SaloonyComponents.renderHeader('global-header', { activePage: 'contact', basePath: '../../' });
      SaloonyComponents.renderFooter('global-footer', { basePath: '../../' });
  });

  const form = document.getElementById('contactForm');
  const statusBox = document.getElementById('statusBox');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusBox.classList.remove('hidden');
    statusBox.className = 'mt-6 p-4 rounded-xl bg-yellow-500/10 text-yellow-200 border border-yellow-500/20';
    statusBox.textContent = 'جاري الإرسال...';

    const payload = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      phone: form.phone.value.trim(),
      subject: form.subject.value.trim(),
      message: form.message.value.trim(),
    };

    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok && data.success) {
        statusBox.className = 'mt-6 p-4 rounded-xl bg-green-500/10 text-green-200 border border-green-500/20';
        statusBox.textContent = 'تم إرسال رسالتك بنجاح! سنرد عليك قريبًا.';
        form.reset();
      } else {
        statusBox.className = 'mt-6 p-4 rounded-xl bg-red-500/10 text-red-200 border border-red-500/20';
        statusBox.textContent = data.error || 'تعذر إرسال الرسالة. حاول لاحقًا.';
      }
    } catch (err) {
      statusBox.className = 'mt-6 p-4 rounded-xl bg-red-500/10 text-red-200 border border-red-500/20';
      statusBox.textContent = 'خطأ في الاتصال بالخادم.';
    }
  });
</script>

</body>
</html>
