<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تواصل معنا - صالوني</title>
    <link rel="icon" type="image/x-icon" href="../../assets/images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/theme.css">
    <script src="../../assets/js/components.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">

    <!-- Global Header -->
    <div id="global-header" class="sticky top-0 z-50"></div>

    <main class="flex-1 container mx-auto px-4 pt-32 pb-12 md:pt-40 md:pb-20 max-w-4xl">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-slate-900 mb-4">تواصل معنا</h1>
            <p class="text-lg text-slate-600">نحن هنا للإجابة على استفساراتك ومساعدتك في أي وقت</p>
        </div>

        <div class="glass-panel rounded-3xl p-6 md:p-10 relative overflow-hidden">
            <!-- Decorative Elements -->
            <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-64 h-64 bg-blue-500/5 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>

            <form id="contactForm" class="relative z-10 space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="name" class="text-sm font-semibold text-slate-700">الاسم</label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all"
                            placeholder="اسمك الكريم">
                    </div>
                    <div class="space-y-2">
                        <label for="email" class="text-sm font-semibold text-slate-700">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all dir-ltr text-right"
                            placeholder="example@email.com">
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="phone" class="text-sm font-semibold text-slate-700">رقم الهاتف</label>
                        <input type="tel" id="phone" name="phone"
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all dir-ltr text-right"
                            placeholder="05xxxxxxxx">
                    </div>
                    <div class="space-y-2">
                        <label for="subject" class="text-sm font-semibold text-slate-700">الموضوع</label>
                        <input type="text" id="subject" name="subject" required
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all"
                            placeholder="عنوان رسالتك">
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="message" class="text-sm font-semibold text-slate-700">الرسالة</label>
                    <textarea id="message" name="message" rows="5" required
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all resize-none"
                        placeholder="كيف يمكننا مساعدتك؟"></textarea>
                </div>

                <button type="submit" 
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/30 transition-all transform hover:-translate-y-1 active:translate-y-0 flex items-center justify-center gap-2">
                    <span>إرسال الرسالة</span>
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </form>

            <!-- Status Messages -->
            <div id="statusBox" class="hidden mt-6 p-4 rounded-xl border text-center font-medium"></div>
        </div>
    </main>

    <!-- Global Footer -->
    <div id="global-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            SaloonyComponents.renderHeader('global-header', { activePage: 'contact', basePath: '../../' });
            SaloonyComponents.renderFooter('global-footer', { basePath: '../../' });
        });

        const form = document.getElementById('contactForm');
        const statusBox = document.getElementById('statusBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading State
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalBtnContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري الإرسال...';
            submitBtn.classList.add('opacity-75');

            statusBox.classList.add('hidden');

            const payload = {
                name: form.name.value.trim(),
                email: form.email.value.trim(),
                phone: form.phone.value.trim(),
                subject: form.subject.value.trim(),
                message: form.message.value.trim(),
            };

            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                statusBox.classList.remove('hidden');
                if (res.ok && data.success) {
                    statusBox.className = 'mt-6 p-4 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-100 font-medium';
                    statusBox.innerHTML = '<i class="fas fa-check-circle mb-2 block text-2xl"></i>تم إرسال رسالتك بنجاح! سنقوم بالرد عليك في أقرب وقت.';
                    form.reset();
                } else {
                    throw new Error(data.error || 'حدث خطأ غير متوقع');
                }
            } catch (err) {
                statusBox.classList.remove('hidden');
                statusBox.className = 'mt-6 p-4 rounded-xl bg-red-50 text-red-600 border border-red-100 font-medium';
                statusBox.innerHTML = '<i class="fas fa-exclamation-circle mb-2 block text-2xl"></i>تعذر إرسال الرسالة. يرجى المحاولة مرة أخرى.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
                submitBtn.classList.remove('opacity-75');
            }
        });
    </script>
</body>
</html>
