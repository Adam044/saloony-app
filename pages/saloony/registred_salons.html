<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script src="../../assets/offline-detect.js"></script>
  <script src="../../assets/app-mode.js"></script>
  <script src="../../assets/js/components.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>الصالونات المنضمة إلى صالوني</title>
  <link rel="icon" href="../../assets/images/Saloony-app_icon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <style>
    .salon-card { 
        background: #FFFFFF; 
        border: 1px solid #E2E8F0; 
        border-radius: 1.25rem; 
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow: hidden;
    }
    .salon-card:hover { 
        transform: translateY(-5px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        border-color: var(--primary);
    }
    .salon-chip { 
        background: rgba(6, 193, 103, 0.1); 
        color: #06C167; 
        border: 1px solid rgba(6, 193, 103, 0.2);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-[#06C167] selection:text-white overflow-x-hidden">

<!-- Global Header Container -->
<div id="global-header"></div>

<main class="flex-1 pt-28 pb-12">
  <section class="max-w-7xl mx-auto px-6">
    <div class="text-center mb-16">
      <div class="inline-flex items-center px-4 py-2 rounded-full bg-slate-100 border border-slate-200 mb-6">
        <span class="text-sm font-medium text-slate-700">شركاء النجاح</span>
      </div>
      <h1 class="text-4xl sm:text-5xl font-black mb-6 text-slate-900">
        صالونات تثق في <span class="text-gradient-primary">صالوني</span>
      </h1>
      <p class="text-lg text-slate-600 max-w-2xl mx-auto font-light">
        نخبة من الصالونات التي اختارت التحول الرقمي وتقديم تجربة حجز استثنائية لعملائها.
      </p>
    </div>

    <!-- Dynamic Container -->
    <div id="salons-container" class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
        <!-- Loading State -->
        <div class="col-span-full text-center py-20">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-slate-200 border-t-[#06C167]"></div>
            <p class="mt-4 text-slate-500">جاري تحميل القائمة...</p>
        </div>
    </div>

    <div class="mt-20 text-center">
      <div class="glass-card p-8 rounded-3xl max-w-2xl mx-auto text-center border border-slate-200">
          <p class="text-lg text-slate-900 mb-6 font-medium">
            هل تريد أن يكون صالونك ضمن هذه القائمة المميزة؟
          </p>
          <a href="contact.html" class="inline-flex items-center justify-center px-8 py-3 rounded-full btn-primary text-base shadow-lg transition transform hover:scale-105">
            انضم إلينا الآن
          </a>
      </div>
    </div>
  </section>
</main>

<div id="global-footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<script>
    // Initialize Global Components
    document.addEventListener('DOMContentLoaded', () => {
        SaloonyComponents.renderHeader('global-header', { activePage: 'salons', basePath: '../../' });
        SaloonyComponents.renderFooter('global-footer', { basePath: '../../' });
        loadRegisteredSalons();
    });

    async function loadRegisteredSalons() {
        const container = document.getElementById('salons-container');
        try {
            // Try to fetch from API first
            let salons = [];
            try {
                const response = await fetch('/api/salons/registered');
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.salons) {
                        salons = data.salons;
                    }
                } else {
                    throw new Error('API not available');
                }
            } catch (e) {
                console.log('API fetch failed, falling back to mock data for preview', e);
                // Mock data for preview/local mode
                salons = [
                    {
                        id: 1,
                        name: "صالون لمسات",
                        image: "../../assets/images/mock1.png", // Ensure these exist or use placeholders
                        city: "رام الله"
                    },
                    {
                        id: 2,
                        name: "بيوتي سنتر",
                        image: "../../assets/images/mock2.png",
                        city: "نابلس"
                    },
                    {
                        id: 3,
                        name: "صالون الملكة",
                        image: "../../assets/images/mock3.png",
                        city: "الخليل"
                    }
                ];
            }

            if (salons.length > 0) {
                container.innerHTML = salons.map(salon => `
                    <article class="salon-card group cursor-pointer overflow-hidden flex flex-col h-full" onclick="window.location.href='/salons/salon.html?id=${salon.id}'">
                        <div class="relative aspect-video overflow-hidden">
                            <img src="${salon.image}" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=${encodeURIComponent(salon.name)}'" alt="${salon.name}" class="w-full h-full object-cover transition duration-700 group-hover:scale-110">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#020617] via-[#020617]/50 to-transparent opacity-90"></div>
                            <div class="absolute bottom-4 right-4 text-white z-10">
                                <h2 class="text-xl font-bold drop-shadow-xl">${salon.name}</h2>
                                <p class="text-sm text-slate-200 flex items-center gap-1 mt-1 font-medium drop-shadow-md">
                                    <i class="fa-solid fa-location-dot text-[#06C167] text-xs"></i>
                                    ${salon.city}
                                </p>
                            </div>
                        </div>
                        <div class="p-6 flex-1 flex flex-col justify-between">
                            <div class="space-y-3 mb-4">
                                <div class="flex flex-wrap gap-2">
                                    <span class="salon-chip px-2 py-1 rounded-md text-xs font-medium">قص شعر</span>
                                    <span class="salon-chip px-2 py-1 rounded-md text-xs font-medium">مكياج</span>
                                </div>
                            </div>
                            
                            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                                <span class="text-slate-900 font-medium text-sm group-hover:text-[#06C167] transition">عرض الصفحة</span>
                                <i class="fa-solid fa-arrow-left text-slate-400 group-hover:translate-x-[-5px] transition-transform"></i>
                            </div>
                        </div>
                    </article>
                `).join('');
            } else {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500">
                        <i class="fa-regular fa-folder-open text-4xl mb-4 opacity-50"></i>
                        <p>لا توجد صالونات مسجلة حالياً.</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error('Error loading salons:', error);
            container.innerHTML = `
                <div class="col-span-full text-center py-12 text-red-400">
                    <p>حدث خطأ أثناء تحميل القائمة. يرجى المحاولة لاحقاً.</p>
                </div>
            `;
        }
    }
</script>
</body>
</html>
