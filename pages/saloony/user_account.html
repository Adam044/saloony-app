<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حسابي - صالوني</title>
    <link rel="icon" type="image/x-icon" href="../../assets/images/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/theme.css">
    <script src="../../assets/js/components.js"></script>
    <script src="../../assets/js/image-optimizer.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }

        .strike-dot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .strike-dot.active {
            background-color: #EF4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <!-- Global Header -->
    <div id="global-header"></div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <main class="pt-24 px-4 max-w-lg mx-auto w-full">
        
        <!-- Profile Header -->
        <div class="relative mb-8 text-center animate-fade-in">
            <div class="inline-block relative group">
                <div class="w-28 h-28 rounded-[2rem] bg-white p-1.5 shadow-2xl shadow-slate-200 rotate-3 group-hover:rotate-0 transition-transform duration-500">
                    <div class="w-full h-full rounded-[1.7rem] bg-slate-100 flex items-center justify-center text-4xl font-black text-slate-300 overflow-hidden relative">
                        <span id="user-initials">?</span>
                        <img id="user-avatar" src="" class="w-full h-full object-cover hidden" alt="Avatar">
                    </div>
                </div>
                <div class="absolute -bottom-2 -right-2 bg-white rounded-xl p-1 shadow-lg">
                    <button onclick="openVerification()" class="w-8 h-8 bg-slate-800 text-white rounded-lg flex items-center justify-center hover:scale-110 transition-transform">
                        <i class="fas fa-camera text-xs"></i>
                    </button>
                </div>
            </div>
            
            <h1 id="user-name" class="text-2xl font-black text-slate-900 mt-6 mb-1">...</h1>
            <p id="user-phone" class="text-slate-400 font-bold dir-ltr font-mono text-sm">...</p>
        </div>

        <!-- Stats / Strikes Grid -->
        <div class="grid grid-cols-2 gap-4 mb-8 animate-slide-up" style="animation-delay: 0.1s;">
            <!-- Wallet/Points (Placeholder for future) -->
            <div class="glass-panel rounded-3xl p-5 flex flex-col items-center justify-center gap-2 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-16 h-16 bg-emerald-500/5 rounded-bl-full -mr-4 -mt-4"></div>
                <span class="text-3xl font-black text-emerald-500" id="total-bookings">-</span>
                <span class="text-xs font-bold text-slate-400">حجوزات ناجحة</span>
            </div>

            <!-- Strikes System -->
            <div class="glass-panel rounded-3xl p-5 flex flex-col items-center justify-center gap-3 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-16 h-16 bg-red-500/5 rounded-br-full -ml-4 -mt-4"></div>
                
                <!-- Dots -->
                <div class="flex items-center gap-2" id="strikes-dots">
                    <div class="w-4 h-4 rounded-full bg-slate-200 strike-dot"></div>
                    <div class="w-4 h-4 rounded-full bg-slate-200 strike-dot"></div>
                    <div class="w-4 h-4 rounded-full bg-slate-200 strike-dot"></div>
                </div>
                
                <div class="flex items-center gap-1.5">
                    <span class="text-xs font-bold text-slate-400">حالة الحساب:</span>
                    <span id="account-status-text" class="text-xs font-black text-emerald-500">نشط</span>
                </div>
            </div>
        </div>

        <!-- Book Again Section -->
        <div id="book-again-section" class="mb-8 hidden animate-slide-up" style="animation-delay: 0.15s;">
            <div class="flex items-center justify-between mb-4 px-2">
                <h2 class="text-lg font-black text-slate-900">حجز مجدداً</h2>
                <span class="text-xs font-bold text-emerald-500 bg-emerald-50 px-2 py-1 rounded-lg">آخر الزيارات</span>
            </div>
            <div id="recent-salons-container" class="flex gap-4 overflow-x-auto pb-4 px-2 snap-x no-scrollbar" style="scroll-padding-left: 1rem; scroll-padding-right: 1rem;">
                <!-- Cards injected here -->
            </div>
        </div>

        <!-- Appointments Section -->
        <div class="animate-slide-up" style="animation-delay: 0.2s;">
            <!-- Tabs -->
            <div class="flex bg-white p-1.5 rounded-2xl shadow-sm border border-slate-100 mb-6">
                <button onclick="switchTab('upcoming')" id="tab-upcoming" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 relative overflow-hidden group text-white bg-slate-800 shadow-lg shadow-slate-200">
                    مواعيد قادمة
                </button>
                <button onclick="switchTab('past')" id="tab-past" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-slate-400 hover:text-slate-600 transition-all duration-300">
                    السجل السابق
                </button>
            </div>

            <!-- List -->
            <div id="appointments-container" class="space-y-4 min-h-[300px]">
                <!-- Loading -->
                <div class="animate-pulse space-y-4">
                    <div class="h-24 bg-slate-200/50 rounded-3xl"></div>
                    <div class="h-24 bg-slate-200/50 rounded-3xl"></div>
                </div>
            </div>
        </div>

        <!-- Footer & Logout -->
        <footer class="mt-12 border-t border-slate-100 pt-8 pb-4 text-center animate-slide-up" style="animation-delay: 0.3s;">
            <div class="flex justify-center gap-6 mb-6">
                <a href="#" class="text-slate-400 hover:text-slate-600 text-sm font-bold">المساعدة</a>
                <a href="#" class="text-slate-400 hover:text-slate-600 text-sm font-bold">الشروط</a>
                <button onclick="logout()" class="text-red-400 hover:text-red-500 text-sm font-bold flex items-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> تسجيل خروج
                </button>
            </div>
            <p class="text-[10px] text-slate-300 font-mono">Saloony &copy; 2026</p>
        </footer>

    </main>

    <!-- Verification Modal -->
    <div id="verification-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-sm transition-opacity opacity-0" id="verification-backdrop" onclick="closeVerification()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-6 transition-transform translate-y-full flex flex-col gap-4 max-h-[90vh]" id="verification-panel">
            <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-2"></div>
            <h3 class="text-lg font-black text-center mb-2">التحقق من الهوية</h3>
            
            <div class="relative rounded-2xl overflow-hidden bg-black aspect-[3/4] shadow-2xl mx-auto w-full max-w-xs ring-4 ring-slate-100">
                <video id="camera-feed" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="camera-canvas" class="hidden"></canvas>
                <img id="captured-preview" class="hidden w-full h-full object-cover">
                
                <!-- Camera Controls -->
                <div class="absolute bottom-6 left-0 right-0 flex justify-center items-center gap-6 z-10">
                    <button id="btn-capture" onclick="capturePhoto()" class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center bg-white/20 backdrop-blur-md hover:scale-105 transition-transform shadow-lg">
                        <div class="w-12 h-12 bg-white rounded-full"></div>
                    </button>
                    
                    <div id="action-buttons" class="hidden flex gap-4">
                        <button onclick="retakePhoto()" class="w-12 h-12 rounded-full bg-slate-800 text-white flex items-center justify-center shadow-lg hover:scale-110 transition-transform">
                            <i class="fas fa-redo"></i>
                        </button>
                        <button onclick="uploadPhoto()" class="w-12 h-12 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-lg hover:scale-110 transition-transform">
                            <i class="fas fa-check"></i>
                        </button>
                    </div>
                </div>

                <!-- Overlay Guidelines -->
                <div class="absolute inset-0 border-2 border-white/20 rounded-2xl pointer-events-none">
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-64 border-2 border-white/40 rounded-[3rem]"></div>
                </div>
            </div>
            <p class="text-center text-xs text-slate-400 mt-2 font-medium">يرجى التقاط صورة واضحة للوجه للتحقق</p>
        </div>
    </div>

    </main>

    <script>
        // --- Helpers ---
        let isRefreshing = false;
        let refreshSubscribers = [];

        function onRefreshed(token) {
            refreshSubscribers.map(cb => cb(token));
            refreshSubscribers = [];
        }

        function addRefreshSubscriber(cb) {
            refreshSubscribers.push(cb);
        }

        async function fetchWithAuth(url, options = {}) {
            let token = localStorage.getItem('saloony_token');
            
            // Prepare headers
            if (!options.headers) options.headers = {};
            if (!(options.body instanceof FormData)) {
                // Only set Content-Type if not FormData (browser sets it for FormData)
                // But existing calls might set it manually. 
                // We should respect existing Content-Type if set, or add JSON if body is string
            }
            
            // Always add Authorization if token exists
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }

            let res = await fetch(url, options);

            // Handle 401 Unauthorized
            if (res.status === 401) {
                if (isRefreshing) {
                    return new Promise(resolve => {
                        addRefreshSubscriber(async (newToken) => {
                            options.headers['Authorization'] = `Bearer ${newToken}`;
                            resolve(await fetch(url, options));
                        });
                    });
                }

                isRefreshing = true;

                try {
                    // Attempt Refresh
                    const refreshRes = await fetch('/api/auth/refresh', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include' // Send cookies
                    });

                    if (refreshRes.ok) {
                        const data = await refreshRes.json();
                        if (data.success && data.token) {
                            console.log('Session refreshed successfully');
                            localStorage.setItem('saloony_token', data.token);
                            if (data.user) {
                                localStorage.setItem('saloony_user', JSON.stringify(data.user));
                            }

                            onRefreshed(data.token);
                            isRefreshing = false;

                            // Retry original request
                            options.headers['Authorization'] = `Bearer ${data.token}`;
                            return await fetch(url, options);
                        }
                    }
                } catch (e) {
                    console.error('Refresh attempt failed:', e);
                }

                // If refresh failed
                isRefreshing = false;
                logout(false);
                throw new Error('Auth failed');
            }

            return res;
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        let currentFilter = 'upcoming';

        // --- Init ---
        document.addEventListener('DOMContentLoaded', async () => {
            SaloonyComponents.renderHeader('global-header', { activePage: 'profile', basePath: '../../' });
            
            await checkAuth();
            loadProfile();
            loadAppointments('upcoming');
            loadRecentSalons();
        });

        // --- Camera & Verification ---
        let stream = null;
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('camera-canvas');
        const preview = document.getElementById('captured-preview');
        const btnCapture = document.getElementById('btn-capture');
        const actionButtons = document.getElementById('action-buttons');
        const modal = document.getElementById('verification-modal');
        const backdrop = document.getElementById('verification-backdrop');
        const panel = document.getElementById('verification-panel');

        async function openVerification() {
            modal.classList.remove('hidden');
            // Animate in
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                panel.classList.remove('translate-y-full');
            }, 10);

            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.classList.remove('hidden');
                preview.classList.add('hidden');
                btnCapture.classList.remove('hidden');
                actionButtons.classList.add('hidden');
                actionButtons.classList.remove('flex');
            } catch (err) {
                console.error(err);
                alert('لا يمكن الوصول للكاميرا. يرجى التأكد من السماح بالوصول.');
                closeVerification();
            }
        }

        function closeVerification() {
            backdrop.classList.add('opacity-0');
            panel.classList.add('translate-y-full');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
            }, 300);
        }

        function capturePhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            
            preview.src = dataUrl;
            preview.classList.remove('hidden');
            video.classList.add('hidden');
            
            btnCapture.classList.add('hidden');
            actionButtons.classList.remove('hidden');
            actionButtons.classList.add('flex');
        }

        function retakePhoto() {
            preview.classList.add('hidden');
            video.classList.remove('hidden');
            btnCapture.classList.remove('hidden');
            actionButtons.classList.add('hidden');
            actionButtons.classList.remove('flex');
        }

        function dataURLtoBlob(dataurl) {
            var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--){
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], {type:mime});
        }

        async function uploadPhoto() {
            const dataUrl = preview.src;
            const blob = dataURLtoBlob(dataUrl);
            const formData = new FormData();
            formData.append('photo', blob, 'user-verification.jpg');
            
            // Show loading state if needed
            
            try {
                const res = await fetchWithAuth('/api/user/upload-photo', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                if (data.success) {
                    // Update UI
                    const avatar = document.getElementById('user-avatar');
                    if (window.ImageOptimizer) {
                        window.ImageOptimizer.optimize(avatar, data.image_url);
                    } else {
                        avatar.src = data.image_url;
                    }
                    avatar.classList.remove('hidden');
                    document.getElementById('user-initials').classList.add('hidden');
                    
                    // Update LocalStorage
                    let user = JSON.parse(localStorage.getItem('saloony_user') || '{}');
                    user.image_url = data.image_url;
                    localStorage.setItem('saloony_user', JSON.stringify(user));
                    
                    closeVerification();
                } else {
                    alert('فشل رفع الصورة: ' + data.message);
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الرفع');
            }
        }

        // --- Data Loading ---
        async function loadProfile() {
            try {
                let user = JSON.parse(localStorage.getItem('saloony_user') || '{}');
                const token = localStorage.getItem('saloony_token');
                
                // Recovery Logic
                if ((!user.name || !user.id) && token) {
                    const payload = parseJwt(token);
                    if (payload && payload.sub) {
                        try {
                            const res = await fetchWithAuth('/api/user/profile', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ userId: payload.sub, user_type: payload.role || 'user' })
                            });
                            if (res.ok) {
                                user = await res.json();
                                localStorage.setItem('saloony_user', JSON.stringify(user));
                            }
                        } catch (e) { console.error(e); }
                    }
                }

                if (user.name) {
                    document.getElementById('user-name').textContent = user.name;
                    document.getElementById('user-phone').textContent = user.phone || 'غير محدد';
                    document.getElementById('user-initials').textContent = user.name.charAt(0).toUpperCase();
                    
                    if (user.image_url) {
                        const avatar = document.getElementById('user-avatar');
                        if (window.ImageOptimizer) {
                            window.ImageOptimizer.optimize(avatar, user.image_url);
                        } else {
                            avatar.src = user.image_url;
                        }
                        avatar.classList.remove('hidden');
                        document.getElementById('user-initials').classList.add('hidden');
                    }

                    // Update Strikes
                    updateStrikesUI(user.strikes_count || 0);
                }
            } catch (err) {
                console.error('Profile load error:', err);
            }
        }

        async function loadRecentSalons() {
            try {
                const token = localStorage.getItem('saloony_token');
                let user = JSON.parse(localStorage.getItem('saloony_user') || '{}');
                // Ensure we have user ID
                if (!user.id) {
                     const payload = parseJwt(token);
                     if (payload) user.id = payload.sub;
                }
                if (!user.id) return;
                
                const res = await fetchWithAuth(`/api/user/${user.id}/recent-salons`);
                const data = await res.json();
                
                if (data.success && data.salons && data.salons.length > 0) {
                    const container = document.getElementById('recent-salons-container');
                    document.getElementById('book-again-section').classList.remove('hidden');
                    
                    container.innerHTML = data.salons.map(salon => {
                        const imgContent = salon.logo_url 
                            ? `<img data-src="${salon.logo_url}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 optimize-me-recent">`
                            : `<div class="w-full h-full flex items-center justify-center bg-slate-200 text-slate-400"><i class="fas fa-store text-2xl"></i></div>`;
                            
                        return `
                        <div class="snap-center shrink-0 w-32 flex flex-col gap-2">
                            <div class="aspect-square rounded-2xl bg-slate-100 overflow-hidden relative shadow-sm group cursor-pointer" onclick="window.location.href='../../salon.html?id=${salon.id}'">
                                ${imgContent}
                                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-60"></div>
                                <button class="absolute bottom-2 right-2 w-8 h-8 bg-white rounded-full flex items-center justify-center text-slate-900 shadow-lg hover:bg-emerald-500 hover:text-white transition-colors">
                                    <i class="fas fa-redo text-xs"></i>
                                </button>
                            </div>
                            <p class="text-xs font-bold text-center truncate px-1 text-slate-700">${salon.name}</p>
                        </div>
                    `}).join('');

                    // Optimize images
                    if (window.ImageOptimizer) {
                        container.querySelectorAll('.optimize-me-recent').forEach(img => {
                            window.ImageOptimizer.optimize(img, img.dataset.src);
                            img.classList.remove('optimize-me-recent');
                        });
                    } else {
                        container.querySelectorAll('.optimize-me-recent').forEach(img => {
                            img.src = img.dataset.src;
                            img.classList.remove('optimize-me-recent');
                        });
                    }
                }
            } catch (e) {
                console.error('Failed to load recent salons', e);
            }
        }

        function updateStrikesUI(strikes) {
            const dotsContainer = document.getElementById('strikes-dots');
            const statusText = document.getElementById('account-status-text');
            
            dotsContainer.innerHTML = '';
            
            // Render 3 dots
            for (let i = 0; i < 3; i++) {
                const isStrike = i < strikes;
                const dot = document.createElement('div');
                dot.className = `w-4 h-4 rounded-full transition-all duration-300 ${
                    isStrike ? 'bg-red-500 shadow-lg shadow-red-500/40 scale-110' : 'bg-slate-200'
                }`;
                dotsContainer.appendChild(dot);
            }

            if (strikes >= 3) {
                statusText.textContent = 'محظور';
                statusText.className = 'text-xs font-black text-red-600';
            } else if (strikes > 0) {
                statusText.textContent = `${strikes} إنذار`;
                statusText.className = 'text-xs font-black text-orange-500';
            } else {
                statusText.textContent = 'ممتاز';
                statusText.className = 'text-xs font-black text-emerald-500';
            }
        }

        async function loadAppointments(filter) {
            currentFilter = filter;
            const container = document.getElementById('appointments-container');
            container.innerHTML = '<div class="animate-pulse space-y-4"><div class="h-24 bg-slate-200/50 rounded-3xl"></div><div class="h-24 bg-slate-200/50 rounded-3xl"></div></div>';

            try {
                const token = localStorage.getItem('saloony_token');
                let user = JSON.parse(localStorage.getItem('saloony_user') || '{}');
                let userId = user.id || (parseJwt(token) || {}).sub;

                if (!userId) { logout(false); return; }
                
                const res = await fetchWithAuth(`/api/appointments/user/${userId}/${filter}`);

                if (!res.ok) throw new Error('Auth failed');
                const data = await res.json();

                if (data.success) {
                    if (filter === 'past') {
                         document.getElementById('total-bookings').textContent = data.appointments.filter(a => a.status === 'Completed').length;
                    }
                    renderAppointments(data.appointments, filter);
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-center text-red-400 py-8">فشل تحميل المواعيد</p>';
            }
        }

        function renderAppointments(appointments, filter) {
            const container = document.getElementById('appointments-container');
            
            if (!appointments || appointments.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 flex flex-col items-center opacity-60">
                        <i class="far fa-calendar-times text-4xl text-slate-300 mb-4"></i>
                        <p class="text-slate-500 font-bold">No ${filter === 'upcoming' ? 'upcoming' : 'past'} appointments</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = appointments.map((appt, idx) => {
                const date = new Date(appt.start_time);
                
                // English Numbers & Specific Date Format (dd/mm/yy)
                const dateStr = date.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: '2-digit' });
                const timeStr = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                
                const statusConfig = getStatusConfig(appt.status);
                const apptJson = encodeURIComponent(JSON.stringify(appt));

                // Image Logic: Logo -> Image -> Placeholder Icon
                const imgSource = appt.logo_url || appt.image_url;
                const imgContent = imgSource 
                    ? `<img data-src="${imgSource}" class="w-full h-full object-cover optimize-me-appt">`
                    : `<div class="w-full h-full flex items-center justify-center bg-slate-50 text-slate-300"><i class="fas fa-store text-xl"></i></div>`;

                return `
                <div onclick="openAppointmentModal('${apptJson}')" class="glass-panel rounded-[1.5rem] p-4 flex items-center gap-4 animate-slide-up hover:scale-[1.02] transition-transform duration-300 cursor-pointer relative overflow-hidden group" style="animation-delay: ${idx * 0.05}s">
                    <!-- Status Strip -->
                    <div class="absolute right-0 top-0 bottom-0 w-1.5 bg-${statusConfig.color}-500"></div>

                    <!-- Salon Logo -->
                    <div class="relative w-16 h-16 rounded-2xl bg-white shrink-0 overflow-hidden shadow-sm border border-slate-100">
                        ${imgContent}
                    </div>
                    
                    <!-- Info -->
                    <div class="flex-1 min-w-0 py-1">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-black text-slate-900 truncate text-base leading-tight">${appt.salon_name}</h3>
                            <span class="text-[10px] font-bold text-${statusConfig.color}-500 bg-${statusConfig.color}-50 px-2 py-0.5 rounded-full whitespace-nowrap">
                                ${statusConfig.text}
                            </span>
                        </div>
                        
                        <p class="text-xs text-slate-400 font-bold mb-2 truncate">${appt.services_names}</p>
                        
                        <div class="flex items-center gap-3 text-[11px] font-bold text-slate-500">
                            <span class="flex items-center gap-1.5 bg-slate-50 px-2 py-1 rounded-lg dir-ltr">
                                <i class="far fa-calendar-alt text-emerald-500"></i> <span class="font-mono">${dateStr}</span>
                            </span>
                            <span class="flex items-center gap-1.5 bg-slate-50 px-2 py-1 rounded-lg dir-ltr">
                                <i class="far fa-clock text-emerald-500"></i> <span class="font-mono">${timeStr}</span>
                            </span>
                        </div>
                    </div>

                    <!-- Arrow -->
                    <div class="text-slate-300 group-hover:text-emerald-500 transition-colors pl-2">
                        <i class="fas fa-chevron-left rtl:rotate-180"></i>
                    </div>
                </div>
                `;
            }).join('');

            // Optimize images
            if (window.ImageOptimizer) {
                container.querySelectorAll('.optimize-me-appt').forEach(img => {
                    window.ImageOptimizer.optimize(img, img.dataset.src);
                    img.classList.remove('optimize-me-appt');
                });
            } else {
                container.querySelectorAll('.optimize-me-appt').forEach(img => {
                    img.src = img.dataset.src;
                    img.classList.remove('optimize-me-appt');
                });
            }
        }

        function getStatusConfig(status) {
            switch(status) {
                case 'Scheduled': return { color: 'emerald', text: 'مؤكد', icon: 'fa-check' };
                case 'Completed': return { color: 'blue', text: 'مكتمل', icon: 'fa-check-double' };
                case 'Cancelled': return { color: 'red', text: 'ملغي', icon: 'fa-times' };
                case 'Absent': return { color: 'red', text: 'لم يحضر', icon: 'fa-user-slash' }; // Strike status
                default: return { color: 'gray', text: status, icon: 'fa-info' };
            }
        }

        function switchTab(tab) {
            const btnUpcoming = document.getElementById('tab-upcoming');
            const btnPast = document.getElementById('tab-past');
            
            if (tab === 'upcoming') {
                btnUpcoming.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 relative overflow-hidden group text-white bg-slate-800 shadow-lg shadow-slate-200';
                btnPast.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold text-slate-400 hover:text-slate-600 transition-all duration-300';
            } else {
                btnPast.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 relative overflow-hidden group text-white bg-slate-800 shadow-lg shadow-slate-200';
                btnUpcoming.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold text-slate-400 hover:text-slate-600 transition-all duration-300';
            }
            loadAppointments(tab);
        }

        async function checkAuth() {
            const token = localStorage.getItem('saloony_token');
            if (!token) {
                logout(false);
                return;
            }
        }

        function logout(apiCall = true) {
            if (apiCall) {
                try { fetch('/api/auth/logout', { method: 'POST' }); } catch(e) {}
            }
            localStorage.removeItem('saloony_token');
            localStorage.removeItem('saloony_user');
            window.location.href = '../../index.html';
        }
    </script>

    <!-- Appointment Details Modal -->
    <div id="appointment-modal" class="fixed inset-0 z-[100] hidden">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0" id="appt-modal-backdrop" onclick="closeAppointmentModal()"></div>
        
        <!-- Modal Content -->
        <div class="absolute bottom-0 left-0 w-full md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-[400px] md:h-auto md:rounded-[2rem] bg-[#F8FAFC] rounded-t-[2.5rem] shadow-2xl transform transition-transform translate-y-full md:translate-y-10 scale-95 opacity-0" id="appt-modal-content">
            
            <!-- Handle for mobile -->
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 mb-2 md:hidden"></div>

            <div class="relative overflow-hidden rounded-t-[2.5rem] md:rounded-t-[2rem]">
                <!-- Salon Cover -->
                <div class="h-32 bg-slate-200 relative">
                    <img id="modal-salon-cover" src="" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                    <button onclick="closeAppointmentModal()" class="absolute top-4 right-4 w-8 h-8 bg-black/20 hover:bg-black/40 backdrop-blur-md rounded-full text-white flex items-center justify-center transition-all">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <!-- Salon Logo & Info -->
                <div class="px-6 -mt-10 relative flex items-end gap-4 mb-6">
                    <div class="w-20 h-20 rounded-[1.5rem] bg-white p-1 shadow-lg">
                        <img id="modal-salon-logo" src="" class="w-full h-full object-cover rounded-[1.2rem]">
                    </div>
                    <div class="mb-2">
                        <h2 id="modal-salon-name" class="text-xl font-black text-white drop-shadow-md leading-none mb-1">...</h2>
                        <p id="modal-salon-address" class="text-xs text-slate-200 font-bold drop-shadow-sm mb-2 flex items-center gap-1">
                            <i class="fas fa-map-marker-alt"></i> <span>...</span>
                        </p>
                        <div id="modal-status-badge" class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-white/90 backdrop-blur text-slate-900">
                            <!-- Status -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scrollable Content -->
            <div class="px-6 pb-8 max-h-[60vh] overflow-y-auto">
                
                <!-- Date & Time -->
                <div class="flex items-center gap-4 mb-6 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                    <div class="flex-1 text-center border-l border-slate-100 pl-4">
                        <p class="text-xs text-slate-400 font-bold mb-1">التاريخ</p>
                        <p id="modal-date" class="text-sm font-black text-slate-800">...</p>
                    </div>
                    <div class="flex-1 text-center">
                        <p class="text-xs text-slate-400 font-bold mb-1">الوقت</p>
                        <p id="modal-time" class="text-sm font-black text-slate-800">...</p>
                    </div>
                </div>

                <!-- Staff -->
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-bold">الموظف</p>
                        <p id="modal-staff" class="text-sm font-bold text-slate-800">...</p>
                    </div>
                </div>

                <!-- Services List -->
                <div class="mb-6">
                    <p class="text-xs text-slate-400 font-bold mb-3">الخدمات</p>
                    <div id="modal-services-list" class="space-y-2">
                        <!-- Services injected here -->
                    </div>
                </div>

                <!-- Total -->
                <div class="flex items-center justify-between border-t border-slate-100 pt-4 mb-6">
                    <span class="font-bold text-slate-500">الإجمالي</span>
                    <span id="modal-total-price" class="text-xl font-black text-emerald-600">...</span>
                </div>

                <!-- Actions -->
                <div class="grid grid-cols-2 gap-3" id="modal-actions">
                    <!-- Actions injected via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Modal Logic
        function openAppointmentModal(apptJson) {
            const appt = JSON.parse(decodeURIComponent(apptJson));
            const modal = document.getElementById('appointment-modal');
            const backdrop = document.getElementById('appt-modal-backdrop');
            const content = document.getElementById('appt-modal-content');
            
            // Populate Data
            // Image Logic for Modal
            const coverImg = document.getElementById('modal-salon-cover');
            const logoImg = document.getElementById('modal-salon-logo');
            
            const coverSrc = appt.image_url || appt.logo_url;
            if (coverSrc) {
                if (window.ImageOptimizer) {
                    window.ImageOptimizer.optimize(coverImg, coverSrc);
                } else {
                    coverImg.src = coverSrc;
                }
                coverImg.classList.remove('hidden');
                // Ensure parent has no fallback background if image is present
                coverImg.parentElement.classList.remove('bg-slate-300'); 
            } else {
                coverImg.classList.add('hidden');
                coverImg.parentElement.classList.add('bg-slate-300'); // Fallback color
            }

            const logoSrc = appt.logo_url;
            if (logoSrc) {
                if (window.ImageOptimizer) {
                    window.ImageOptimizer.optimize(logoImg, logoSrc);
                } else {
                    logoImg.src = logoSrc;
                }
                logoImg.classList.remove('hidden');
                // Hide placeholder if exists (we might need to add one in HTML if we want perfect fallback)
            } else {
                // If no logo, maybe show a default or hide
                logoImg.classList.add('hidden');
                // If we had a placeholder icon in HTML we would show it here.
                // For now, let's just use a generic transparent pixel to avoid broken image icon if hidden class doesn't work for some reason
                logoImg.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; 
            }

            document.getElementById('modal-salon-name').textContent = appt.salon_name;
            document.getElementById('modal-salon-address').querySelector('span').textContent = appt.location_text || 'العنوان غير متوفر';
            
            const statusConfig = getStatusConfig(appt.status);
            const statusBadge = document.getElementById('modal-status-badge');
            statusBadge.className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[10px] font-bold ${
                appt.status === 'Scheduled' ? 'bg-emerald-100 text-emerald-700' : 
                appt.status === 'Cancelled' ? 'bg-red-100 text-red-700' : 
                'bg-slate-100 text-slate-700'
            }`;
            statusBadge.innerHTML = `<i class="fas ${statusConfig.icon}"></i> ${statusConfig.text}`;

            const date = new Date(appt.start_time);
            // English Numbers & Specific Date Format (dd/mm/yy)
            document.getElementById('modal-date').textContent = date.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: '2-digit' });
            document.getElementById('modal-time').textContent = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            
            document.getElementById('modal-staff').textContent = appt.staff_name || 'أي موظف متاح';
            
            // Services
            const servicesContainer = document.getElementById('modal-services-list');
            if (appt.all_services && appt.all_services.length > 0) {
                servicesContainer.innerHTML = appt.all_services.map(s => `
                    <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-50 shadow-sm">
                        <span class="text-sm font-bold text-slate-700">${s.name_ar}</span>
                        <span class="text-xs font-bold text-slate-400">${parseInt(s.price)} ₪</span>
                    </div>
                `).join('');
            } else {
                servicesContainer.innerHTML = `
                    <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-50 shadow-sm">
                        <span class="text-sm font-bold text-slate-700">${appt.service_name}</span>
                        <span class="text-xs font-bold text-slate-400">${parseInt(appt.price)} ₪</span>
                    </div>
                `;
            }

            document.getElementById('modal-total-price').textContent = `${parseInt(appt.price)} ₪`;

            // Actions
            const actionsContainer = document.getElementById('modal-actions');
            actionsContainer.innerHTML = '';
            
            // Call Button
            if (appt.phone_number) {
                actionsContainer.innerHTML += `
                    <a href="tel:${appt.phone_number}" class="flex items-center justify-center gap-2 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-colors">
                        <i class="fas fa-phone"></i> اتصال
                    </a>
                `;
            }

            // Directions Button
            if (appt.location_text) {
                 const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(appt.location_text)}`;
                 actionsContainer.innerHTML += `
                    <a href="${mapsUrl}" target="_blank" class="flex items-center justify-center gap-2 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-colors">
                        <i class="fas fa-location-arrow"></i> الموقع
                    </a>
                `;
            }

            // Cancel Button (if scheduled and in future)
            if (appt.status === 'Scheduled' && new Date(appt.start_time) > new Date()) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'flex items-center justify-center gap-2 py-3 bg-red-50 text-red-600 rounded-xl font-bold hover:bg-red-100 transition-colors col-span-2';
                cancelBtn.innerHTML = '<i class="fas fa-times"></i> إلغاء الموعد';
                cancelBtn.onclick = () => cancelAppointment(appt.id);
                actionsContainer.appendChild(cancelBtn);
            }

            // Show Modal
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                backdrop.classList.remove('opacity-0');
                content.classList.remove('translate-y-full', 'scale-95', 'opacity-0');
                content.classList.add('md:translate-y-0'); // Reset translate for desktop
            });
        }

        function closeAppointmentModal() {
            const modal = document.getElementById('appointment-modal');
            const backdrop = document.getElementById('appt-modal-backdrop');
            const content = document.getElementById('appt-modal-content');
            
            backdrop.classList.add('opacity-0');
            content.classList.add('translate-y-full', 'scale-95', 'opacity-0');
            content.classList.remove('md:translate-y-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        async function cancelAppointment(id) {
            if(!confirm('هل أنت متأكد من إلغاء هذا الموعد؟')) return;
            
            try {
                const res = await fetchWithAuth(`/api/appointments/cancel/${id}`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    closeAppointmentModal();
                    loadAppointments(currentFilter);
                    
                    // Show toast or alert
                    alert(data.message);
                    
                    // Update user strikes if needed
                    // ideally reload the page or fetch user data again
                    location.reload(); 
                } else {
                    alert(data.message || 'فشل إلغاء الموعد');
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الإلغاء');
            }
        }
    </script>
